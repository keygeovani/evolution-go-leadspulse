name: Build Evolution Go WhatsApp 405 QR hotfix
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Go build without DB or schema migrations
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/evolution-go
      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable hotfix image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/keygeovani/evolution-go-leadspulse:qr-405-hotfix-20261104
          labels: |
            org.opencontainers.image.source=https://github.com/keygeovani/evolution-go-leadspulse
            org.opencontainers.image.description=WhatsApp QR 405 handshake fix; no whatsmeow schema migration
          cache-from: type=gha
          cache-to: type=gha,mode=max
